server:
  port: 80
  servlet:
    application-display-name: '前后端分离后台模板'
    session:
      timeout: 30m

spring:
  profiles:
    active: pro
  jackson:
    time-zone: GMT+8
    date-format: 'yyyy-MM-dd HH:mm:ss'
  datasource:
    url: jdbc:mysql://localhost/backend?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2b8
    username: backend
    password: backend
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  #        model:
  #          generator_name_as_sequence_name: false
  data:
    web:
      pageable:
        one-indexed-parameters: true
    redis:
      repositories:
        enabled: false
logging:
  config: classpath:logback-spring.xml


